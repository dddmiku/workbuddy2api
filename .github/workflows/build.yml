# build.yml 多架构打包发布 ghcr.io（网关 + 管理台）与 amd64 离线 tar.gz artifact。
# 解决 issue #21「建议打包现成 docker 镜像」：NAS/离线环境拉不到 ghcr 时用 artifact。
# 推 v* tag 时额外产出同名版本镜像，部署方可以固定版本而不是跟着 latest 漂。
name: Build & Publish

on:
  schedule:
    # 每天北京时间 12:00 = UTC 04:00
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    tags: ['v*'] # 打 tag 也触发发布

permissions:
  contents: read
  packages: write

jobs:
  gateway:
    name: Gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.json for build
        run: cp config.example.json config.json

      # setup-qemu 必须在 setup-buildx 之前：buildx 多架构依赖 QEMU 跨平台模拟。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像名必须全小写：github.repository 含大写（Sliverkiss/...），需转小写
      - name: Compute image tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<TAGS'
            echo "${name}:latest"
            echo "${name}:${GITHUB_SHA}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "${name}:${GITHUB_REF_NAME}"; fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      # 额外导出 amd64 离线 tar.gz：NAS 拉不到 ghcr 时用 artifact 部署。
      - name: Export offline tarball (amd64)
        run: |
          docker buildx build --platform linux/amd64 --file Dockerfile \
            --tag wb2api:offline --output type=docker,dest=wb2api-amd64.tar .
          gzip -f wb2api-amd64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb2api-amd64
          path: wb2api-amd64.tar.gz
          if-no-files-found: error

  panel:
    name: Admin panel image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 管理台镜像固定加 -panel 后缀，与网关镜像同属一个发布节奏。
      - name: Compute image tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}-panel"
          {
            echo 'tags<<TAGS'
            echo "${name}:latest"
            echo "${name}:${GITHUB_SHA}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "${name}:${GITHUB_REF_NAME}"; fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: panel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel

      - name: Export offline tarball (amd64)
        run: |
          docker buildx build --platform linux/amd64 --file panel/Dockerfile \
            --tag wb2api-admin:offline --output type=docker,dest=wb2api-admin-amd64.tar panel
          gzip -f wb2api-admin-amd64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb2api-admin-amd64
          path: wb2api-admin-amd64.tar.gz
          if-no-files-found: error
