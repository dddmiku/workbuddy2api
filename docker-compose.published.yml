# ═══ 更新日志 ═══
# 2026-09-18：发布镜像同样给网关 3 分钟停机宽限，保留在途 RPC 收尾和状态落盘时间。
# 用 ghcr.io 上已发布的镜像启动，不在本地构建。
#
#   cd /opt/workbuddy2api
#   sudo docker compose -f docker-compose.published.yml pull
#   sudo docker compose -f docker-compose.published.yml up -d
#
# 目录准备（config.json、auths/、data/、panel-data/）、加账号和启动后的验证与
# docker-compose.yml 完全一致，见 README「快速开始」。
# 需要固定版本时把 :latest 换成发布页上的版本号，例如 :v1.1.0。
services:
  wb2api:
    image: ghcr.io/dddmiku/workbuddy2api:latest
    container_name: workbuddy2api
    restart: unless-stopped
    stop_grace_period: 3m
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json:ro

  wb2api-admin:
    image: ghcr.io/dddmiku/workbuddy2api-panel:latest
    container_name: wb2api-admin
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - WB2API_GATEWAY_DIR=/gateway
      - WB2API_ADMIN_DIR=/data
      - WB2API_ADMIN_HOST=0.0.0.0
      - WB2API_GATEWAY_URL=http://wb2api:7863
      - WB2API_CONTAINER=workbuddy2api
    ports:
      - "127.0.0.1:7864:7864"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/gateway
      - ./panel-data:/data
    depends_on:
      - wb2api
